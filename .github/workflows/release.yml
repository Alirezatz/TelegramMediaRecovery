name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without the v prefix
        required: true
        type: string
        default: "1.1.0"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release request
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases must be built from main.'
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Version must use stable major.minor.patch format, for example 1.1.0.'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          dotnet build TelegramMediaRecovery.slnx -c Release "-p:Version=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test TelegramMediaRecovery.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish CLI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          dotnet publish src/TelegramMediaRecovery.Cli -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false `
            "-p:Version=$env:RELEASE_VERSION" -o artifacts/cli

      - name: Publish desktop app
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          dotnet publish src/TelegramMediaRecovery.Desktop -c Release -r win-x64 --self-contained `
            "-p:Version=$env:RELEASE_VERSION" -o artifacts/desktop

      - name: Package applications
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path artifacts\cli\* `
            -DestinationPath "artifacts\TelegramMediaRecovery-CLI-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path artifacts\desktop\* `
            -DestinationPath "artifacts\TelegramMediaRecovery-Desktop-$env:RELEASE_VERSION-win-x64.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create "v$env:RELEASE_VERSION" `
            "artifacts\TelegramMediaRecovery-CLI-$env:RELEASE_VERSION-win-x64.zip" `
            "artifacts\TelegramMediaRecovery-Desktop-$env:RELEASE_VERSION-win-x64.zip" `
            --target main `
            --title "Telegram Media Recovery $env:RELEASE_VERSION" `
            --generate-notes
